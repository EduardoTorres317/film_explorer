<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello React!</title>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>

    <script>
      // FIX 1: Extract functions from the global React object
      const { useState, useEffect, createElement } = React;

      function CounterApp() {
        // State for the counter value
        const [count, setCount] = useState(0);

        // Function to increment the counter
        const increment = () => {
          setCount((prevCount) => prevCount + 1);
        };

        // Function to increment the counter
        const decrement = () => {
          setCount((prevCount) => prevCount - 1);
        };

        // Return the component structure using React.createElement
        return createElement(
          "div",
          null,
          createElement("p", null, `Current Count: ${count}`),
          createElement("button", { onClick: increment }, "Increase Counter"),
          createElement("button", { onClick: decrement }, "Decrease Counter"),
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(CounterApp));
    </script>
  </body>
</html>
